document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

><sc-raw-td style=\"padding:5px 0 5px 24px;text-align:right;font-weight:700;\">{{ totalHT }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                      <sc-if value=\"{{ hasDiscount }}\" hint-placeholder-val=\"{{ false }}\">\n                        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:#41496a;\">Remise<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0 5px 24px;text-align:right;font-weight:700;\">{{ discountLabel }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ d.tvaEnabled }}\" hint-placeholder-val=\"{{ true }}\">\n                        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:#41496a;\">TVA {{ tvaRate }} %<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0 5px 24px;text-align:right;font-weight:700;\">{{ tvaAmount }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                      <\u002Fsc-if>\n                      <sc-raw-tr><sc-raw-td colspan=\"2\" style=\"padding:0;\"><div style=\"height:1px;background:#0a1f44;margin:4px 0;\"><\u002Fdiv><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                      <sc-raw-tr><sc-raw-td style=\"padding:7px 0;font-weight:800;font-size:11pt;\">{{ netLabel }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0 7px 24px;text-align:right;font-weight:800;font-size:11pt;\">{{ netTotal }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                      <sc-if value=\"{{ hasPaid }}\" hint-placeholder-val=\"{{ false }}\">\n                        <sc-raw-tr><sc-raw-td style=\"padding:4px 0;color:#41496a;\">Déjà réglé<\u002Fsc-raw-td><sc-raw-td style=\"padding:4px 0 4px 24px;text-align:right;font-weight:700;\">{{ paidLabel }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                        <sc-raw-tr><sc-raw-td style=\"padding:4px 0;font-weight:800;\">Reste dû<\u002Fsc-raw-td><sc-raw-td style=\"padding:4px 0 4px 24px;text-align:right;font-weight:800;\">{{ dueLabel }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                      <\u002Fsc-if>\n                    <\u002Fsc-raw-tbody>\n                  <\u002Fsc-raw-table>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ hasNotes }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin:14px 46px 0 46px;font-size:8.5pt;line-height:1.6;color:#41496a;\">{{ d.notes }}<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"flex:1;\"><\u002Fdiv>\n\n              <div style=\"margin:0 46px 14px 46px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:end;\">\n                <div style=\"font-size:8pt;line-height:1.65;color:#41496a;\">\n                  <div style=\"font-size:7pt;letter-spacing:0.14em;text-transform:uppercase;color:#8b90ab;font-weight:700;\">Règlement<\u002Fdiv>\n                  <div style=\"margin-top:5px;\">{{ s.bank.name }}<br>RIB {{ s.bank.rib }} · BIC {{ s.bank.bic }}<br>IBAN {{ s.bank.iban }}<br>{{ payLine }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border:1px solid #e2e5ee;height:86px;padding:8px 12px;\">\n                  <div style=\"font-size:7pt;letter-spacing:0.14em;text-transform:uppercase;color:#8b90ab;font-weight:700;\">{{ signLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:0 46px 14px 46px;font-size:6.5pt;line-height:1.65;color:#6b7392;text-align:center;\">\n                {{ s.company.name }} · Capital social {{ s.company.capital }} · RCCM {{ s.company.rccm }} · NIU {{ s.company.niu }} · {{ s.company.centre }} · {{ s.company.email }}\n              <\u002Fdiv>\n              <div style=\"height:6px;background:{{ barA }};display:flex;justify-content:flex-end;\">\n                <div style=\"width:34%;background:{{ barB }};\"><\u002Fdiv>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}\">\nconst KEY = \"atlastech.facturation.v1\";\n\nconst TYPES = {\n  FAC: { label: \"Facture\", title: \"FACTURE\", prefix: \"FAC\" },\n  PRO: { label: \"Facture proforma\", title: \"FACTURE PROFORMA\", prefix: \"PRO\" },\n  DEV: { label: \"Devis\", title: \"DEVIS\", prefix: \"DEV\" },\n  BL: { label: \"Bon de livraison\", title: \"BON DE LIVRAISON\", prefix: \"BL\" },\n  REC: { label: \"Reçu de paiement\", title: \"REÇU DE PAIEMENT\", prefix: \"REC\" }\n};\n\nconst U = [\"zéro\",\"un\",\"deux\",\"trois\",\"quatre\",\"cinq\",\"six\",\"sept\",\"huit\",\"neuf\",\"dix\",\"onze\",\"douze\",\"treize\",\"quatorze\",\"quinze\",\"seize\",\"dix-sept\",\"dix-huit\",\"dix-neuf\"];\nconst TENS = [\"\",\"\",\"vingt\",\"trente\",\"quarante\",\"cinquante\",\"soixante\",\"soixante\",\"quatre-vingt\",\"quatre-vingt\"];\n\nfunction c99(n) {\n  if (n < 20) return U[n];\n  const t = Math.floor(n / 10), u = n % 10;\n  const base = TENS[t];\n  if (t === 7 || t === 9) return base + (u === 0 ? \"-dix\" : (u === 1 && t === 7 ? \"-et-onze\" : \"-\" + U[10 + u]));\n  if (t === 8 && u === 0) return \"quatre-vingts\";\n  if (u === 0) return base;\n  if (u === 1 && t >= 2 && t <= 6) return base + \"-et-un\";\n  return base + \"-\" + U[u];\n}\nfunction c999(n) {\n  const h = Math.floor(n / 100), r = n % 100;\n  let s = \"\";\n  if (h > 0) s = (h === 1 ? \"cent\" : U[h] + \" cent\") + (r === 0 && h > 1 ? \"s\" : \"\");\n  if (r > 0) s += (s ? \" \" : \"\") + c99(r);\n  return s || \"zéro\";\n}\nfunction words(n) {\n  n = Math.round(Math.abs(Number(n) || 0));\n  if (n === 0) return \"zéro\";\n  const scales = [[1e9, \"milliard\"], [1e6, \"million\"], [1000, \"mille\"]];\n  const out = [];\n  let rest = n;\n  for (const sc of scales) {\n    const q = Math.floor(rest / sc[0]);\n    if (q > 0) {\n      if (sc[1] === \"mille\") out.push((q === 1 ? \"\" : c999(q) + \" \") + \"mille\");\n      else out.push(c999(q) + \" \" + sc[1] + (q > 1 ? \"s\" : \"\"));\n      rest %= sc[0];\n    }\n  }\n  if (rest > 0) out.push(c999(rest));\n  return out.join(\" \").trim();\n}\n\nconst fmt = n => (Math.round(Number(n) || 0)).toLocaleString(\"fr-FR\").replace(/\\u202f/g, \" \") + \" FCFA\";\nconst frDate = iso => {\n  if (!iso) return \"—\";\n  const p = String(iso).split(\"-\");\n  return p.length === 3 ? p[2] + \"/\" + p[1] + \"/\" + p[0] : iso;\n};\nconst today = () => new Date().toISOString().slice(0, 10);\nconst addDays = (iso, days) => {\n  const d = new Date(iso || today());\n  d.setDate(d.getDate() + Number(days || 0));\n  return d.toISOString().slice(0, 10);\n};\n\nconst DEFAULT_SETTINGS = {\n  company: {\n    name: \"ATLASTECH SOLUTION SARL\",\n    addr1: \"Douala, Makepe St Tropez\",\n    addr2: \"\",\n    tel: \"+237 622 52 45 44 · +237 641 17 53 43\",\n    email: \"contact@atlastech.cm\",\n    capital: \"1 000 000 FCFA\",\n    rccm: \"CM-DLA-02-2026-B13-00606\",\n    niu: \"M062618767654X\",\n    centre: \"CFLP Douala 5\",\n    gerant: \"Wadebe Christophe\"\n  },\n  bank: {\n    name: \"AFG Bank Cameroun — Agence Douala-Plateau\",\n    rib: \"10034 00020 00058874601 49\",\n    bic: \"ATCRCMCM\",\n    iban: \"CM21 10034 00020 00058874601 49\"\n  },\n  mobileMoney: \"\",\n  terms: 30,\n  tva: 19.25\n};\n\nconst DEFAULT_CATALOG = [\n  { label: \"VoxEcho — licence annuelle\", unit: \"an\", price: 0 },\n  { label: \"Tontio — licence annuelle\", unit: \"an\", price: 0 },\n  { label: \"Fileo — licence annuelle\", unit: \"an\", price: 0 },\n  { label: \"Edufo — licence annuelle\", unit: \"an\", price: 0 },\n  { label: \"Kliniko — licence annuelle\", unit: \"an\", price: 0 },\n  { label: \"Lumea — licence annuelle\", unit: \"an\", price: 0 },\n  { label: \"Conseil et audit des systèmes d'information\", unit: \"jour/homme\", price: 0 },\n  { label: \"Développement sur-mesure\", unit: \"jour/homme\", price: 0 },\n  { label: \"Hébergement et infogérance\", unit: \"mois\", price: 0 },\n  { label: \"Formation professionnelle au numérique\", unit: \"jour\", price: 0 }\n];\n\nfunction migrate(s) {\n  const c = s.company || (s.company = {});\n  if (/BP|4736|Makepe\\s*[·—-]/i.test(c.addr1 || \"\")) c.addr1 = \"Douala, Makepe St Tropez\";\n  if (/Orchid|Isabella/i.test(c.addr2 || \"\")) c.addr2 = \"\";\n  if (/·/.test(c.email || \"\")) c.email = \"contact@atlastech.cm\";\n  return s;\n}\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let saved = null;\n    try { saved = JSON.parse(localStorage.getItem(KEY) || \"null\"); } catch (e) { saved = null; }\n    const docs = (saved && Array.isArray(saved.docs)) ? saved.docs : [];\n    const savedView = saved && saved.view ? saved.view : \"dash\";\n    this.state = {\n      view: (savedView === \"edit\" && !docs.length) ? \"dash\" : savedView,\n      docs: docs,\n      currentId: docs.length ? docs[0].id : null,\n      letter: Object.assign({ variant: \"vierge\", place: \"Douala\", date: today(), to: \"\", object: \"\", body: \"\", signer: \"Wadebe Christophe, Gérant\" }, (saved && saved.letter) || {}),\n      settings: migrate(Object.assign({}, DEFAULT_SETTINGS, (saved && saved.settings) || {})),\n      catalog: (saved && Array.isArray(saved.catalog)) ? saved.catalog : DEFAULT_CATALOG.slice()\n    };\n  }\n\n  componentDidMount() {\n    const settings = migrate(JSON.parse(JSON.stringify(this.state.settings)));\n    this.setState({ settings }, () => this.persist());\n  }\n\n  persist(next) {\n    const s = Object.assign({}, this.state, next || {});\n    try {\n      localStorage.setItem(KEY, JSON.stringify({ docs: s.docs, settings: s.settings, catalog: s.catalog, view: s.view, letter: s.letter }));\n    } catch (e) {}\n  }\n  set(next) { this.setState(next, () => this.persist()); }\n\n  nextNumber(type) {\n    const year = new Date().getFullYear();\n    const prefix = TYPES[type].prefix + \"-\" + year + \"-\";\n    const nums = this.state.docs\n      .filter(d => d.number && d.number.indexOf(prefix) === 0)\n      .map(d => parseInt(d.number.slice(prefix.length), 10) || 0);\n    const n = nums.length ? Math.max.apply(null, nums) + 1 : 1;\n    return prefix + String(n).padStart(3, \"0\");\n  }\n\n  blank(type) {\n    const t = type || \"FAC\";\n    return {\n      id: \"d\" + Date.now() + Math.floor(Math.random() * 1000),\n      type: t,\n      number: this.nextNumber(t),\n      date: today(),\n      client: { name: \"\", address: \"\", city: \"\", niu: \"\", email: \"\" },\n      object: \"\", ref: \"\", contact: \"\",\n      lines: [{ desc: \"\", qty: 1, price: 0 }],\n      discount: 0,\n      tvaEnabled: true,\n      payments: [],\n      notes: \"\"\n    };\n  }\n\n  current() {\n    return this.state.docs.find(d => d.id === this.state.currentId) || null;\n  }\n\n  updateDoc(mutator) {\n    const docs = this.state.docs.map(d => {\n      if (d.id !== this.state.currentId) return d;\n      const copy = JSON.parse(JSON.stringify(d));\n      mutator(copy);\n      return copy;\n    });\n    this.setState({ docs }, () => this.persist());\n  }\n\n  totals(doc) {\n    if (!doc) return { ht: 0, tva: 0, net: 0, paid: 0, due: 0 };\n    const ht = (doc.lines || []).reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.price) || 0), 0);\n    const afterDiscount = Math.max(0, ht - (Number(doc.discount) || 0));\n    const rate = Number(this.state.settings.tva) || 0;\n    const tva = doc.tvaEnabled ? afterDiscount * rate / 100 : 0;\n    const net = afterDiscount + tva;\n    const paid = (doc.payments || []).reduce((a, p) => a + (Number(p.amount) || 0), 0);\n    return { ht, tva, net, paid, due: Math.max(0, net - paid) };\n  }\n\n  status(doc) {\n    if (doc.type !== \"FAC\") return { label: TYPES[doc.type].label, bg: \"#eef0f6\", fg: \"#41496a\" };\n    const t = this.totals(doc);\n    if (t.net > 0 && t.paid >= t.net) return { label: \"Payée\", bg: \"#e3f4ea\", fg: \"#1f7a4d\" };\n    if (t.paid > 0) return { label: \"Partielle\", bg: \"#fdf3dd\", fg: \"#8a6a13\" };\n    return { label: \"Impayée\", bg: \"#fbe9e9\", fg: \"#a33\" };\n  }\n\n  renderVals() {\n    const st = this.state;\n    const s = st.settings;\n    const doc = this.current();\n    const t = this.totals(doc);\n    const rate = Number(s.tva) || 0;\n    const type = doc ? doc.type : \"FAC\";\n    const showPrices = type !== \"BL\";\n    const navStyle = v => \"background:\" + (st.view === v ? \"rgba(232,168,37,0.16)\" : \"transparent\") +\n      \";color:\" + (st.view === v ? \"#e8a825\" : \"#c9d1e6\") +\n      \";border:none;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:700;text-align:left;cursor:pointer;\";\n\n    const billed = st.docs.filter(d => d.type === \"FAC\");\n    const statBilled = billed.reduce((a, d) => a + this.totals(d).net, 0);\n    const statPaid = billed.reduce((a, d) => a + this.totals(d).paid, 0);\n\n    const byMonth = {};\n    billed.forEach(d => {\n      const k = (d.date || \"\").slice(0, 7);\n      byMonth[k] = (byMonth[k] || 0) + this.totals(d).net;\n    });\n    const keys = Object.keys(byMonth).sort().reverse().slice(0, 6);\n    const maxM = keys.reduce((a, k) => Math.max(a, byMonth[k]), 0) || 1;\n    const MONTHS = [\"janvier\",\"février\",\"mars\",\"avril\",\"mai\",\"juin\",\"juillet\",\"août\",\"septembre\",\"octobre\",\"novembre\",\"décembre\"];\n    const monthly = keys.map(k => {\n      const p = k.split(\"-\");\n      return {\n        label: (MONTHS[Number(p[1]) - 1] || k) + \" \" + p[0],\n        pct: Math.round(byMonth[k] / maxM * 100) + \"%\",\n        total: fmt(byMonth[k])\n      };\n    });\n\n    const secondLabel = { FAC: \"Échéance\", PRO: \"Validité\", DEV: \"Validité\", BL: \"Livraison\", REC: \"Reçu le\" }[type];\n    const secondValue = type === \"FAC\" ? frDate(addDays(doc && doc.date, s.terms))\n      : (type === \"PRO\" || type === \"DEV\") ? (s.terms ? \"30 jours\" : \"—\")\n      : frDate(doc && doc.date);\n\n    const st0 = doc ? this.status(doc) : { label: \"\", bg: \"#eef0f6\", fg: \"#41496a\" };\n\n    return {\n      s: s,\n      isDash: st.view === \"dash\", isList: st.view === \"list\", isEdit: st.view === \"edit\" && !!doc,\n      isCat: st.view === \"cat\", isSet: st.view === \"set\",\n      isHead: st.view === \"head\", noCurrent: st.view === \"edit\" && !doc,\n      navDash: navStyle(\"dash\"), navList: navStyle(\"list\"), navEdit: navStyle(\"edit\"),\n      navCat: navStyle(\"cat\"), navSet: navStyle(\"set\"), navHead: navStyle(\"head\"),\n\n      letter: st.letter,\n      isCourrier: st.letter.variant === \"courrier\",\n      fullHeader: st.letter.variant !== \"suite\",\n      shortHeader: st.letter.variant === \"suite\",\n      placeDate: st.letter.place + \", le \" + frDate(st.letter.date),\n      onLetterField: e => {\n        const el = e.currentTarget;\n        this.set({ letter: Object.assign({}, this.state.letter, { [el.dataset.f]: el.value }) });\n      },\n\n      statBilled: fmt(statBilled), statPaid: fmt(statPaid), statDue: fmt(Math.max(0, statBilled - statPaid)),\n      statCount: String(st.docs.length), monthly: monthly,\n\n      noDocs: st.docs.length === 0,\n      docRows: st.docs.map(d => {\n        const dt = this.totals(d), ds = this.status(d);\n        return {\n          id: d.id, number: d.number, typeLabel: TYPES[d.type].label,\n          client: d.client.name || \"—\", date: frDate(d.date), total: fmt(dt.net),\n          status: ds.label, statusBg: ds.bg, statusFg: ds.fg\n        };\n      }),\n\n      catalog: st.catalog.map((c, i) => ({ i: i, label: c.label, unit: c.unit, price: c.price })),\n\n      d: doc || { number: \"\", type: \"FAC\", date: \"\", client: {}, object: \"\", ref: \"\", contact: \"\", discount: 0, tvaEnabled: true, notes: \"\" },\n      lines: doc ? doc.lines.map((l, i) => ({\n        i: i, desc: l.desc, qty: l.qty, price: l.price,\n        amount: fmt((Number(l.qty) || 0) * (Number(l.price) || 0))\n      })) : [],\n      payments: doc ? (doc.payments || []).map((p, i) => ({ i: i, date: p.date, amount: p.amount })) : [],\n      showPayments: type === \"FAC\",\n      canConvert: type === \"PRO\" || type === \"DEV\",\n\n      sheetLines: doc ? doc.lines.map(l => ({\n        desc: l.desc || \" \",\n        qty: l.qty === \"\" || l.qty == null ? \"\" : String(l.qty),\n        price: showPrices ? fmt(l.price) : \"\",\n        amount: showPrices ? fmt((Number(l.qty) || 0) * (Number(l.price) || 0)) : \"\"\n      })) : [],\n\n      docTitle: TYPES[type].title,\n      barA: (type === \"PRO\" || type === \"REC\") ? \"#e8a825\" : \"#0a1f44\",\n      barB: (type === \"PRO\" || type === \"REC\") ? \"#0a1f44\" : \"#e8a825\",\n      dateLabel: frDate(doc && doc.date),\n      secondDateLabel: secondLabel, secondDateValue: secondValue,\n      clientLabel: type === \"BL\" ? \"Livré à\" : (type === \"PRO\" || type === \"DEV\") ? \"Destinataire\" : \"Client\",\n      clientName: (doc && doc.client.name) || \"—\",\n      clientNiu: doc && doc.client.niu ? \"NIU : \" + doc.client.niu : \"\",\n      objectLabel: (doc && doc.object) || \"—\",\n      refLabel: doc && doc.ref ? \"Référence : \" + doc.ref : \"\",\n      contactLabel: doc && doc.contact ? \"Contact : \" + doc.contact : \"\",\n      colPrice: showPrices ? \"Prix unitaire\" : \"\",\n      colAmount: showPrices ? \"Montant\" : \"Observations\",\n      showTotals: showPrices,\n      wordsLabel: type === \"REC\" ? \"Reçu la somme de\" : \"Arrêté le présent document à\",\n      netWords: words(t.net) + \" francs CFA\",\n      totalHT: fmt(t.ht),\n      hasDiscount: Number(doc && doc.discount) > 0,\n      discountLabel: \"− \" + fmt(doc && doc.discount),\n      tvaAmount: fmt(t.tva),\n      tvaRate: String(rate).replace(\".\", \",\"),\n      netLabel: type === \"REC\" ? \"Montant reçu\" : type === \"FAC\" ? \"Net à payer\" : \"Montant total\",\n      netTotal: fmt(t.net),\n      hasPaid: t.paid > 0,\n      paidLabel: fmt(t.paid), dueLabel: fmt(t.due),\n      hasNotes: !!(doc && doc.notes),\n      payLine: s.mobileMoney\n        ? \"Mobile Money : \" + s.mobileMoney + \" · Paiement à \" + s.terms + \" jours\"\n        : \"Paiement à \" + s.terms + \" jours date de facture\",\n      signLabel: type === \"BL\" ? \"Reçu conforme — nom, date et signature\"\n        : (type === \"PRO\" || type === \"DEV\") ? \"Bon pour accord — cachet et signature\"\n        : \"Cachet et signature\",\n      statusLabel: st0.label, statusBg: st0.bg, statusFg: st0.fg,\n\n      onNav: e => this.set({ view: e.currentTarget.dataset.v }),\n      newDoc: () => {\n        const doc2 = this.blank(\"FAC\");\n        this.setState({ docs: [doc2].concat(this.state.docs), currentId: doc2.id, view: \"edit\" }, () => this.persist());\n      },\n      openDoc: e => this.set({ currentId: e.currentTarget.dataset.id, view: \"edit\" }),\n      dupDoc: e => {\n        const src = this.state.docs.find(x => x.id === e.currentTarget.dataset.id);\n        if (!src) return;\n        const copy = JSON.parse(JSON.stringify(src));\n        copy.id = \"d\" + Date.now();\n        copy.number = this.nextNumber(copy.type);\n        copy.date = today();\n        copy.payments = [];\n        this.setState({ docs: [copy].concat(this.state.docs), currentId: copy.id, view: \"edit\" }, () => this.persist());\n      },\n      delDoc: e => {\n        const id = e.currentTarget.dataset.id;\n        const docs = this.state.docs.filter(x => x.id !== id);\n        this.setState({ docs, currentId: this.state.currentId === id ? (docs[0] ? docs[0].id : null) : this.state.currentId }, () => this.persist());\n      },\n      convertToInvoice: () => {\n        const src = this.current();\n        if (!src) return;\n        const copy = JSON.parse(JSON.stringify(src));\n        copy.id = \"d\" + Date.now();\n        copy.type = \"FAC\";\n        copy.number = this.nextNumber(\"FAC\");\n        copy.date = today();\n        copy.ref = src.number;\n        copy.payments = [];\n        this.setState({ docs: [copy].concat(this.state.docs), currentId: copy.id }, () => this.persist());\n      },\n\n      onDocField: e => {\n        const el = e.currentTarget;\n        const f = el.dataset.f;\n        const val = el.type === \"checkbox\" ? el.checked : el.value;\n        this.updateDoc(d => {\n          if (f.indexOf(\".\") > -1) {\n            const p = f.split(\".\");\n            d[p[0]][p[1]] = val;\n          } else if (f === \"type\") {\n            d.type = val;\n            d.number = this.nextNumber(val);\n          } else if (f === \"discount\") {\n            d.discount = Number(val) || 0;\n          } else {\n            d[f] = val;\n          }\n        });\n      },\n      onLineField: e => {\n        const el = e.currentTarget, i = Number(el.dataset.i), f = el.dataset.f;\n        this.updateDoc(d => { d.lines[i][f] = f === \"desc\" ? el.value : (el.value === \"\" ? \"\" : Number(el.value)); });\n      },\n      addLine: () => this.updateDoc(d => d.lines.push({ desc: \"\", qty: 1, price: 0 })),\n      delLine: e => {\n        const i = Number(e.currentTarget.dataset.i);\n        this.updateDoc(d => { d.lines.splice(i, 1); if (!d.lines.length) d.lines.push({ desc: \"\", qty: 1, price: 0 }); });\n      },\n      insertCatalog: e => {\n        const i = Number(e.currentTarget.value);\n        if (e.currentTarget.value === \"\") return;\n        const c = this.state.catalog[i];\n        e.currentTarget.value = \"\";\n        if (!c) return;\n        this.updateDoc(d => {\n          if (d.lines.length === 1 && !d.lines[0].desc) d.lines = [];\n          d.lines.push({ desc: c.label + (c.unit ? \" (\" + c.unit + \")\" : \"\"), qty: 1, price: Number(c.price) || 0 });\n        });\n      },\n      addPay: () => this.updateDoc(d => { d.payments = (d.payments || []).concat([{ date: today(), amount: 0 }]); }),\n      delPay: e => {\n        const i = Number(e.currentTarget.dataset.i);\n        this.updateDoc(d => d.payments.splice(i, 1));\n      },\n      onPayField: e => {\n        const el = e.currentTarget, i = Number(el.dataset.i), f = el.dataset.f;\n        this.updateDoc(d => { d.payments[i][f] = f === \"amount\" ? (Number(el.value) || 0) : el.value; });\n      },\n\n      onCatField: e => {\n        const el = e.currentTarget, i = Number(el.dataset.i), f = el.dataset.f;\n        const catalog = this.state.catalog.map((c, j) => j === i ? Object.assign({}, c, { [f]: f === \"price\" ? (Number(el.value) || 0) : el.value }) : c);\n        this.set({ catalog });\n      },\n      addCat: () => this.set({ catalog: this.state.catalog.concat([{ label: \"\", unit: \"\", price: 0 }]) }),\n      delCat: e => {\n        const i = Number(e.currentTarget.dataset.i);\n        this.set({ catalog: this.state.catalog.filter((c, j) => j !== i) });\n      },\n\n      onSetField: e => {\n        const el = e.currentTarget, f = el.dataset.f;\n        const settings = JSON.parse(JSON.stringify(this.state.settings));\n        const val = (f === \"terms\" || f === \"tva\") ? (Number(el.value) || 0) : el.value;\n        if (f.indexOf(\".\") > -1) { const p = f.split(\".\"); settings[p[0]][p[1]] = val; }\n        else settings[f] = val;\n        this.set({ settings });\n      },\n\n      doPrint: () => window.print(),\n      mailDoc: () => {\n        const doc2 = this.current();\n        if (!doc2) return;\n        const tt = this.totals(doc2);\n        const subject = TYPES[doc2.type].label + \" \" + doc2.number + \" — \" + s.company.name;\n        const body = \"Bonjour,\\n\\nVeuillez trouver ci-joint notre \" + TYPES[doc2.type].label.toLowerCase() +\n          \" n° \" + doc2.number + \" du \" + frDate(doc2.date) +\n          (doc2.object ? \"\\nObjet : \" + doc2.object : \"\") +\n          \"\\nMontant : \" + fmt(tt.net) +\n          \"\\n\\nCordialement,\\n\" + s.company.name + \"\\n\" + s.company.tel;\n        window.location.href = \"mailto:\" + encodeURIComponent(doc2.client.email || \"\") +\n          \"?subject=\" + encodeURIComponent(subject) + \"&body=\" + encodeURIComponent(body);\n      },\n      exportData: () => {\n        const blob = new Blob([JSON.stringify({ docs: st.docs, settings: s, catalog: st.catalog }, null, 2)], { type: \"application/json\" });\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(blob);\n        a.download = \"atlastech-facturation-\" + today() + \".json\";\n        a.click();\n      },\n      importData: e => {\n        const file = e.currentTarget.files && e.currentTarget.files[0];\n        if (!file) return;\n        const r = new FileReader();\n        r.onload = () => {\n          try {\n            const data = JSON.parse(r.result);\n            this.setState({\n              docs: Array.isArray(data.docs) ? data.docs : st.docs,\n              settings: Object.assign({}, DEFAULT_SETTINGS, data.settings || {}),\n              catalog: Array.isArray(data.catalog) ? data.catalog : st.catalog,\n              currentId: (data.docs && data.docs[0]) ? data.docs[0].id : null\n            }, () => this.persist());\n          } catch (err) { window.alert(\"Fichier de sauvegarde illisible.\"); }\n        };\n        r.readAsText(file);\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
